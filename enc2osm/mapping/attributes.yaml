# S-57 attribute acronym -> OSM attribute key (suffix of seamark:<object>:<key>).
#
#   key:   OSM attribute key (OSM wiki Seamarks/Seamark_Attributes). `name` is emitted as
#          seamark:name, all others as seamark:<type or slave key>:<key>.
#   kind:  enum    single code, translated via values.yaml
#          list    code list, each translated via values.yaml, joined with ';'
#          text    verbatim text
#          number  decimal, written without trailing '.0'
#          int     integer
#          depth   decimal in the cell's depth units (DSPM_DUNI) -> metres
#          height  decimal in the cell's height units (DSPM_HUNI) -> metres
#          siggrp  signal group '(3)' -> '3'; '()' -> omitted; anything else -> unmapped
#          meta    provenance / meta information: consumed elsewhere or deliberately dropped,
#                  never counted as unmapped
#   values: (enum/list) name of the table in values.yaml; defaults to the acronym.
#
# Attributes not listed here are unmapped: dropped (or kept as enc:<ACRONYM> with --keep-raw)
# and counted in the stats report.

OBJNAM: {key: name, kind: text}

BOYSHP: {key: shape, kind: enum}
BCNSHP: {key: shape, kind: enum}
TOPSHP: {key: shape, kind: enum}
COLOUR: {key: colour, kind: list}
COLPAT: {key: colour_pattern, kind: list}

